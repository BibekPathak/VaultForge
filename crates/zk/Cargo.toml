[package]
name = "vaultforge-zk"
version = "0.1.0"
edition = "2021"

[dependencies]
vaultforge-crypto = { path = "../crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
thiserror = "1"
log = "0.4"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
