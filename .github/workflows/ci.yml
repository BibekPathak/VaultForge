name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  RUST_VERSION: "stable"

jobs:
  go-lint:
    name: Go Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download
        working-directory: services/api

      - name: Vet
        run: go vet ./...
        working-directory: services/api

      - name: Build
        run: go build -o vaultforge-api .
        working-directory: services/api

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaultforge
          POSTGRES_PASSWORD: vaultforge
          POSTGRES_DB: vaultforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test -v -count=1 -race ./...
        working-directory: services/api
        env:
          DATABASE_URL: "host=localhost user=vaultforge password=vaultforge dbname=vaultforge_test port=5432 sslmode=disable"

  rust-test:
    name: Rust Tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [crypto, mpc, zk, policy, types, transaction, solana]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/${{ matrix.crate }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles(format('crates/{0}/Cargo.toml', matrix.crate)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.crate }}-

      - name: Test
        run: cargo test
        working-directory: crates/${{ matrix.crate }}

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: crates/${{ matrix.crate }}

      - name: Format check
        run: cargo fmt -- --check
        working-directory: crates/${{ matrix.crate }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile.api -t vaultforge-api:test ..

      - name: Verify image
        run: docker run --rm vaultforge-api:test --help || true
