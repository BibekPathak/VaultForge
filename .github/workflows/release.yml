name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: "1.25"
  RUST_VERSION: "stable"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ── Tests (must pass before release) ──────────────
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaultforge
          POSTGRES_PASSWORD: vaultforge
          POSTGRES_DB: vaultforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: go test -v -count=1 -race ./...
        working-directory: services/api
        env:
          DATABASE_URL: "host=localhost user=vaultforge password=vaultforge dbname=vaultforge_test port=5432 sslmode=disable"

  rust-test:
    name: Rust Tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [crypto, mpc, zk, policy, types, transaction, solana]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/${{ matrix.crate }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles(format('crates/{0}/Cargo.toml', matrix.crate)) }}
      - name: Test
        run: cargo test
        working-directory: crates/${{ matrix.crate }}

  # ── Build & Push Docker Image ─────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [go-test, rust-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Extract changelog for this version
          VERSION="${GITHUB_REF#refs/tags/}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          # Write to file (multiline safe)
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          files: |
            deploy/openapi.yaml
          generate_release_notes: true

  # ── Notify ────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
      - name: Release notification
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          STATUS="${{ needs.release.result }}"
          echo "=== Release $VERSION: $STATUS ==="
          # Add Slack/Discord webhook here:
          # curl -X POST "$SLACK_WEBHOOK" \
          #   -H "Content-Type: application/json" \
          #   -d "{\"text\": \"VaultForge $VERSION released ($STATUS)\"}"
