# VaultForge API - Nginx Reverse Proxy
# Usage: include this in your server block or use as-is with TLS termination

# Rate limiting zones (defined in http block)
# limit_req_zone $binary_remote_addr zone=vaultforge_limit:10m rate=30r/s;

upstream vaultforge_backend {
    least_conn;
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.vaultforge.io;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.vaultforge.io;

    # TLS configuration
    ssl_certificate /etc/letsencrypt/live/api.vaultforge.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vaultforge.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Logging
    access_log /var/log/vaultforge/access.log combined buffer=16k flush=5s;
    error_log /var/log/vaultforge/error.log warn;

    # Client limits
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Health endpoints (no auth, no rate limit)
    location /health {
        proxy_pass http://vaultforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /ready {
        proxy_pass http://vaultforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /metrics {
        proxy_pass http://vaultforge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Restrict to internal networks
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # API endpoints (rate limited)
    location /v1/ {
        limit_req zone=vaultforge_limit burst=50 nodelay;

        proxy_pass http://vaultforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Deny all other paths
    location / {
        return 404 '{"error":"not_found","message":"route not found"}';
        add_header Content-Type application/json;
    }
}
