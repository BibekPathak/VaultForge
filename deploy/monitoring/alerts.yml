groups:
  # ── API Server Alerts ──────────────────────────────
  - name: vaultforge-api
    rules:
      - alert: VaultForgeAPIDown
        expr: up{job="vaultforge-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: vaultforge
        annotations:
          summary: "VaultForge API is down"
          description: "API instance {{ $labels.instance }} has been unreachable for >1 minute."
          runbook_url: "https://vaultforge.io/docs/runbook#api-server-failover"

      - alert: VaultForgeHighErrorRate
        expr: rate(vaultforge_http_errors_total[5m]) / rate(vaultforge_http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge error rate > 1%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: VaultForgeHighLatency
        expr: histogram_quantile(0.99, rate(vaultforge_http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge p99 latency > 500ms"
          description: "p99 latency is {{ $value | humanizeDuration }} over the last 5 minutes."

      - alert: VaultForgeHighCPU
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge CPU usage > 80%"
          description: "CPU usage is {{ $value | humanizePercentage }}."

      - alert: VaultForgeHighMemory
        expr: go_memstats_alloc_bytes / go_memstats_sys_bytes > 0.8
        for: 10m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge memory usage > 80%"
          description: "Memory usage is {{ $value | humanizePercentage }}."

      - alert: VaultForgeGoroutineSpike
        expr: go_goroutines > 10000
        for: 5m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge goroutine count > 10,000"
          description: "Current goroutine count: {{ $value }}"

  # ── Database Alerts ────────────────────────────────
  - name: vaultforge-db
    rules:
      - alert: VaultForgeDBDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: vaultforge
        annotations:
          summary: "VaultForge PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is unreachable."

      - alert: VaultForgeDBPoolExhausted
        expr: vaultforge_db_pool_in_use / vaultforge_db_pool_max_open > 0.8
        for: 5m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge DB connection pool > 80%"
          description: "Pool utilization is {{ $value | humanizePercentage }}."

      - alert: VaultForgeDBConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge PostgreSQL connections > 80"
          description: "Active connections: {{ $value }}"

      - alert: VaultForgeDBDiskUsageHigh
        expr: (pg_database_size_bytes / 1073741824) > 15
        for: 1h
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge DB size > 15 GB"
          description: "Database size: {{ $value | humanize1024 }}B"

  # ── Solana RPC Alerts ──────────────────────────────
  - name: vaultforge-solana
    rules:
      - alert: VaultForgeSolanaRPCDown
        expr: vaultforge_solana_rpc_healthy == 0
        for: 3m
        labels:
          severity: critical
          service: vaultforge
        annotations:
          summary: "VaultForge Solana RPC is unhealthy"
          description: "Solana RPC health check has been failing for >3 minutes."
          runbook_url: "https://vaultforge.io/docs/runbook#solana-rpc-failover"

      - alert: VaultForgeSolanaRPCSlow
        expr: vaultforge_solana_rpc_latency_seconds > 2
        for: 5m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge Solana RPC latency > 2s"
          description: "Average RPC latency: {{ $value | humanizeDuration }}"

  # ── Business Logic Alerts ──────────────────────────
  - name: vaultforge-business
    rules:
      - alert: VaultForgeReconcilerStuck
        expr: time() - vaultforge_reconciler_last_success_timestamp > 300
        for: 5m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge reconciler hasn't processed in >5 minutes"
          description: "Last successful reconciliation was {{ $value | humanizeDuration }} ago."

      - alert: VaultForgeWebhookFailures
        expr: rate(vaultforge_webhook_delivery_failed_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge webhook deliveries failing"
          description: "Webhook failure rate: {{ $value | humanizePercentage }} over 10 minutes."

      - alert: VaultForgeIntentBacklog
        expr: vaultforge_intents_pending > 100
        for: 15m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge intent backlog > 100"
          description: "{{ $value }} intents are pending processing."

  # ── Infrastructure Alerts ──────────────────────────
  - name: vaultforge-infra
    rules:
      - alert: VaultForgeDiskUsageHigh
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 1h
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "VaultForge disk usage > 85%"
          description: "Available disk space: {{ $value | humanizePercentage }}"

      - alert: VaultForgeBackupMissing
        expr: time() - vaultforge_last_backup_timestamp > 172800
        for: 5m
        labels:
          severity: warning
          service: vaultforge
        annotations:
          summary: "No VaultForge backup in >48 hours"
          description: "Last backup was {{ $value | humanizeDuration }} ago."
