[package]
name = "vault_policy"
version = "0.1.0"
description = "VaultForge on-chain policy verification program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
# Pin blake3 + zeroize to editions that build with the SBF toolchain's
# rustc 1.84, which cannot parse edition2024 manifests (blake3 >= 1.6,
# zeroize_derive >= 1.5).
blake3 = "=1.5.5"
zeroize = "=1.3.0"
zeroize_derive = "=1.4.2"
