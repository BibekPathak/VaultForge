services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultforge-db
    environment:
      POSTGRES_USER: vaultforge
      POSTGRES_PASSWORD: vaultforge
      POSTGRES_DB: vaultforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: vaultforge-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "host=postgres user=vaultforge password=vaultforge dbname=vaultforge port=5432 sslmode=disable"
      SOLANA_RPC_URL: "https://api.devnet.solana.com"
      VAULTFORGE_ENV: "development"
      LOG_LEVEL: "info"
      SHUTDOWN_TIMEOUT: "10s"
      MAX_BODY_BYTES: "10485760"
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M

volumes:
  pgdata:
